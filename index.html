    <style>
@import url('https://fonts.googleapis.com/css2?family=Russo+One&family=Space+Mono:wght@400;700&display=swap');

:root {
    --sky-dark: #0f0c29;
    --sky-mid: #302b63;
    --sky-light: #24243e;
    --coral: #ff7675;
    --yellow: #fdcb6e;
    --cyan: #00cec9;
    --magenta: #fd79a8;
    --fog: #1a1a2e;
    --text-light: #f8f9fa;
    --text-dim: #adb5bd;
    --panel-bg: rgba(15, 12, 41, 0.92);
    --panel-border: rgba(0, 206, 201, 0.3);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Space Mono', monospace;
    color: var(--text-light);
    overflow-x: hidden;
    background: linear-gradient(180deg, var(--sky-dark) 0%, var(--sky-mid) 50%, var(--sky-light) 100%);
    cursor: crosshair;
}

#webgl-canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
}

/* Loading Screen */
#loading-screen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, var(--sky-dark) 0%, var(--sky-mid) 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 9999;
    transition: opacity 1s ease;
}

#loading-screen.fade-out {
    opacity: 0;
    pointer-events: none;
}

.loader-container {
    text-align: center;
}

.loader-ring {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 150px;
    height: 150px;
    border: 3px solid transparent;
    border-top-color: var(--cyan);
    border-radius: 50%;
    animation: spin 1.5s linear infinite;
}

.loader-ring:nth-child(2) {
    width: 120px;
    height: 120px;
    border-top-color: var(--magenta);
    animation-duration: 2s;
    animation-direction: reverse;
}

.loader-ring:nth-child(3) {
    width: 90px;
    height: 90px;
    border-top-color: var(--yellow);
    animation-duration: 2.5s;
}

@keyframes spin {
    to { transform: translate(-50%, -50%) rotate(360deg); }
}

.loader-container h2 {
    font-family: 'Russo One', sans-serif;
    font-size: 1.5rem;
    margin-top: 200px;
    color: var(--cyan);
    text-shadow: 0 0 20px var(--cyan);
    letter-spacing: 3px;
}

.loading-percentage {
    font-size: 2.5rem;
    font-weight: 700;
    color: var(--yellow);
    margin-top: 20px;
    text-shadow: 0 0 30px var(--yellow);
}

/* Scroll Hint */
#scroll-hint {
    position: fixed;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 100;
    text-align: center;
    animation: fadeInUp 1s ease forwards, bounce 2s ease-in-out infinite;
    animation-delay: 0s, 1s;
    opacity: 0;
}

#scroll-hint.hidden {
    display: none;
}

.scroll-icon {
    width: 30px;
    height: 50px;
    border: 2px solid var(--cyan);
    border-radius: 20px;
    margin: 0 auto 10px;
    position: relative;
    box-shadow: 0 0 20px var(--cyan);
}

.scroll-wheel {
    width: 4px;
    height: 10px;
    background: var(--cyan);
    border-radius: 2px;
    position: absolute;
    top: 8px;
    left: 50%;
    transform: translateX(-50%);
    animation: scroll 1.5s ease-in-out infinite;
}

@keyframes scroll {
    0%, 100% { top: 8px; opacity: 1; }
    50% { top: 24px; opacity: 0.3; }
}

@keyframes bounce {
    0%, 100% { transform: translateX(-50%) translateY(0); }
    50% { transform: translateX(-50%) translateY(-10px); }
}

@keyframes fadeInUp {
    to { opacity: 1; transform: translateX(-50%) translateY(0); }
}

/* Zone Indicator */
#zone-indicator {
    position: fixed;
    top: 30px;
    right: 30px;
    z-index: 100;
    background: var(--panel-bg);
    border: 2px solid var(--panel-border);
    padding: 15px 30px;
    border-radius: 10px;
    backdrop-filter: blur(10px);
    box-shadow: 0 0 30px rgba(0, 206, 201, 0.2);
}

#zone-name {
    font-family: 'Russo One', sans-serif;
    font-size: 1.2rem;
    color: var(--cyan);
    text-transform: uppercase;
    letter-spacing: 2px;
    text-shadow: 0 0 10px var(--cyan);
}

/* Progress Bar */
#progress-container {
    position: fixed;
    top: 30px;
    left: 30px;
    width: 300px;
    z-index: 100;
}

.progress-bar {
    width: 100%;
    height: 8px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid var(--panel-border);
}

#progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--cyan), var(--magenta));
    border-radius: 10px;
    width: 0%;
    transition: width 0.3s ease;
    box-shadow: 0 0 20px var(--cyan);
}

.progress-dots {
    display: flex;
    justify-content: space-between;
    margin-top: 15px;
}

.dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.2);
    border: 2px solid transparent;
    transition: all 0.3s ease;
    cursor: pointer;
}

.dot.active {
    background: var(--cyan);
    border-color: var(--cyan);
    box-shadow: 0 0 15px var(--cyan);
    transform: scale(1.3);
}

/* Content Panels */
#content-panels {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 50;
    pointer-events: none;
}

.panel {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    max-width: 800px;
    width: 90%;
    max-height: 80vh;
    overflow-y: auto;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s ease;
}

.panel.active {
    opacity: 1;
    pointer-events: all;
}

.panel-content {
    background: var(--panel-bg);
    border: 3px solid var(--panel-border);
    border-radius: 20px;
    padding: 40px;
    backdrop-filter: blur(15px);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 0 0 40px rgba(0, 206, 201, 0.2);
}

.panel-content h1, .panel-content h2, .panel-content h3 {
    font-family: 'Russo One', sans-serif;
    color: var(--cyan);
    text-shadow: 0 0 20px var(--cyan);
    margin-bottom: 20px;
    letter-spacing: 2px;
}

.panel-content h1 {
    font-size: 3rem;
    text-align: center;
}

.panel-content h2 {
    font-size: 2rem;
    border-bottom: 3px solid var(--cyan);
    padding-bottom: 15px;
    margin-bottom: 30px;
}

.panel-content h3 {
    font-size: 1.5rem;
    margin-top: 30px;
}

/* Glitch Effect */
.glitch-text {
    position: relative;
    animation: glitch 3s infinite;
}

@keyframes glitch {
    0%, 100% { transform: translate(0); }
    20% { transform: translate(-2px, 2px); }
    40% { transform: translate(-2px, -2px); }
    60% { transform: translate(2px, 2px); }
    80% { transform: translate(2px, -2px); }
}

/* Intro Panel */
.subtitle {
    text-align: center;
    font-size: 1.3rem;
    color: var(--yellow);
    margin-bottom: 30px;
    text-shadow: 0 0 15px var(--yellow);
}

.bio-container {
    margin: 30px 0;
}

.bio-container p {
    margin-bottom: 15px;
    line-height: 1.8;
    color: var(--text-dim);
    font-size: 1.05rem;
}

.stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 20px;
    margin-top: 30px;
}

.stat-card {
    background: rgba(0, 206, 201, 0.1);
    border: 2px solid var(--cyan);
    border-radius: 15px;
    padding: 20px;
    text-align: center;
    transition: all 0.3s ease;
}

.stat-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 10px 30px rgba(0, 206, 201, 0.3);
}

.stat-label {
    font-size: 0.9rem;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 1px;
}

.stat-value {
    font-family: 'Russo One', sans-serif;
    font-size: 1.5rem;
    color: var(--cyan);
    margin-top: 10px;
    text-shadow: 0 0 10px var(--cyan);
}

/* Timeline */
.timeline {
    position: relative;
}

.timeline-item {
    margin-bottom: 40px;
    padding-left: 40px;
    position: relative;
    border-left: 3px solid var(--cyan);
}

.timeline-item::before {
    content: '';
    position: absolute;
    left: -8px;
    top: 0;
    width: 13px;
    height: 13px;
    background: var(--cyan);
    border-radius: 50%;
    box-shadow: 0 0 15px var(--cyan);
}

.timeline-item h3 {
    color: var(--yellow);
    font-size: 1.3rem;
    margin-bottom: 5px;
}

.timeline-company {
    color: var(--magenta);
    font-weight: 700;
    margin-bottom: 5px;
}

.timeline-period {
    color: var(--text-dim);
    font-size: 0.9rem;
    margin-bottom: 15px;
}

.timeline-description {
    color: var(--text-dim);
    line-height: 1.7;
}

/* Projects Grid */
.projects-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 25px;
}

.project-card {
    background: rgba(255, 255, 255, 0.05);
    border: 2px solid transparent;
    border-radius: 15px;
    padding: 25px;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
}

.project-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    transition: opacity 0.3s ease;
    z-index: -1;
}

.project-card:hover {
    transform: translateY(-8px);
    border-color: var(--cyan);
    box-shadow: 0 15px 40px rgba(0, 206, 201, 0.3);
}

.project-card:hover::before {
    opacity: 0.1;
}

.project-emoji {
    font-size: 3rem;
    margin-bottom: 15px;
    display: block;
}

.project-card h3 {
    color: var(--cyan);
    font-size: 1.3rem;
    margin-bottom: 15px;
}

.project-description {
    color: var(--text-dim);
    margin-bottom: 20px;
    line-height: 1.6;
}

.project-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}

.tag {
    background: rgba(0, 206, 201, 0.2);
    border: 1px solid var(--cyan);
    color: var(--cyan);
    padding: 5px 15px;
    border-radius: 20px;
    font-size: 0.85rem;
    font-weight: 700;
}

/* Skills Categories */
.skills-categories {
    display: grid;
    gap: 30px;
}

.skill-category {
    background: rgba(255, 255, 255, 0.05);
    border: 2px solid var(--magenta);
    border-radius: 15px;
    padding: 25px;
}

.skill-category h3 {
    color: var(--magenta);
    font-size: 1.3rem;
    margin-bottom: 20px;
}

.skill-item {
    margin-bottom: 20px;
}

.skill-name {
    display: flex;
    justify-content: space-between;
    margin-bottom: 8px;
    color: var(--text-light);
}

.skill-bar {
    width: 100%;
    height: 12px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid var(--magenta);
}

.skill-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--magenta), var(--cyan));
    border-radius: 10px;
    transition: width 1s ease;
    box-shadow: 0 0 15px var(--magenta);
}

/* Education */
.education-list {
    display: grid;
    gap: 25px;
}

.education-item {
    background: rgba(255, 255, 255, 0.05);
    border: 2px solid var(--yellow);
    border-radius: 15px;
    padding: 25px;
    display: flex;
    gap: 20px;
    align-items: start;
    transition: all 0.3s ease;
}

.education-item:hover {
    transform: translateX(10px);
    box-shadow: 0 10px 30px rgba(253, 203, 110, 0.2);
}

.education-icon {
    font-size: 3rem;
}

.education-details h3 {
    color: var(--yellow);
    margin-bottom: 5px;
}

.education-institution {
    color: var(--cyan);
    font-weight: 700;
    margin-bottom: 5px;
}

.education-period {
    color: var(--text-dim);
    font-size: 0.9rem;
    margin-bottom: 10px;
}

.education-description {
    color: var(--text-dim);
}

/* Certifications */
.certifications-list {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 15px;
}

.certification-badge {
    background: rgba(0, 206, 201, 0.1);
    border: 2px solid var(--cyan);
    border-radius: 10px;
    padding: 15px 20px;
    text-align: center;
    color: var(--cyan);
    font-weight: 700;
    transition: all 0.3s ease;
}

.certification-badge:hover {
    background: rgba(0, 206, 201, 0.2);
    transform: scale(1.05);
    box-shadow: 0 5px 20px rgba(0, 206, 201, 0.3);
}

/* Contact Links */
.contact-links {
    display: grid;
    gap: 20px;
    margin-top: 30px;
}

.contact-link {
    display: flex;
    align-items: center;
    gap: 15px;
    background: rgba(255, 255, 255, 0.05);
    border: 2px solid var(--cyan);
    border-radius: 15px;
    padding: 20px;
    text-decoration: none;
    color: var(--text-light);
    transition: all 0.3s ease;
}

.contact-link:hover {
    background: rgba(0, 206, 201, 0.1);
    transform: translateX(10px);
    box-shadow: 0 10px 30px rgba(0, 206, 201, 0.3);
    border-color: var(--yellow);
}

.contact-icon {
    font-size: 2rem;
}

.contact-text {
    font-size: 1.1rem;
    font-weight: 700;
}

/* Scrollbar */
.panel::-webkit-scrollbar {
    width: 10px;
}

.panel::-webkit-scrollbar-track {
    background: rgba(255, 255, 255, 0.05);
    border-radius: 10px;
}

.panel::-webkit-scrollbar-thumb {
    background: var(--cyan);
    border-radius: 10px;
}

.panel::-webkit-scrollbar-thumb:hover {
    background: var(--magenta);
}

/* Responsive */
@media (max-width: 768px) {
    .panel-content {
        padding: 25px;
    }
    
    .panel-content h1 {
        font-size: 2rem;
    }
    
    .panel-content h2 {
        font-size: 1.5rem;
    }
    
    #zone-indicator {
        top: 15px;
        right: 15px;
        padding: 10px 20px;
    }
    
    #progress-container {
        top: 15px;
        left: 15px;
        width: 200px;
    }
    
    .projects-grid,
    .certifications-list {
        grid-template-columns: 1fr;
    }
}
    </style>
</head>

const PATH_LENGTH = 300;
const ZONE_BOUNDARIES = [0, -25, -65, -115, -175, -225, -265, -300];

// ========== PATH FUNCTION ==========
function getPathX(z) {
    return Math.sin(z * 0.05) * 12 + Math.sin(z * 0.02) * 5;
}

// ========== ANIME MATERIAL SYSTEM ==========
function createAnimeMaterial(color, options = {}) {
    const gradientMap = new THREE.DataTexture(
        new Uint8Array([0, 128, 255]),
        3, 1, THREE.RedFormat
    );
    gradientMap.needsUpdate = true;

    return new THREE.MeshToonMaterial({
        color: color,
        gradientMap: gradientMap,
        emissive: options.emissive || 0x000000,
        emissiveIntensity: options.emissiveIntensity || 0,
        ...options
    });
}

function addOutline(mesh, thickness = 0.02) {
    const outlineMaterial = new THREE.MeshBasicMaterial({
        color: 0x000000,
        side: THREE.BackSide
    });

    const outlineMesh = mesh.clone();
    outlineMesh.material = outlineMaterial;
    outlineMesh.scale.multiplyScalar(1 + thickness);
    mesh.add(outlineMesh);
}

// ========== CHARACTER CREATION ==========
function createCharacter() {
    const characterGroup = new THREE.Group();
    const scale = 1.5;

    // Head
    const headGeo = new THREE.SphereGeometry(0.5 * scale, 16, 16);
    const headMat = createAnimeMaterial(0xffdcb6);
    const head = new THREE.Mesh(headGeo, headMat);
    head.position.y = 1.8 * scale;
    addOutline(head, 0.02);
    characterGroup.add(head);

    // Body (Coral suit)
    const bodyGeo = new THREE.CylinderGeometry(0.4 * scale, 0.5 * scale, 1.2 * scale, 8);
    const bodyMat = createAnimeMaterial(0xff7675);
    const body = new THREE.Mesh(bodyGeo, bodyMat);
    body.position.y = 1 * scale;
    addOutline(body, 0.02);
    characterGroup.add(body);

    // Arms
    const armGeo = new THREE.CylinderGeometry(0.15 * scale, 0.15 * scale, 1 * scale, 8);
    const armMat = createAnimeMaterial(0xff7675);
    
    const leftArm = new THREE.Mesh(armGeo, armMat);
    leftArm.position.set(-0.6 * scale, 1 * scale, 0);
    leftArm.rotation.z = 0.3;
    addOutline(leftArm, 0.02);
    characterGroup.add(leftArm);

    const rightArm = new THREE.Mesh(armGeo, armMat);
    rightArm.position.set(0.6 * scale, 1 * scale, 0);
    rightArm.rotation.z = -0.3;
    addOutline(rightArm, 0.02);
    characterGroup.add(rightArm);

    // Legs (Dark pants)
    const legGeo = new THREE.CylinderGeometry(0.2 * scale, 0.18 * scale, 1 * scale, 8);
    const legMat = createAnimeMaterial(0x2d3436);
    
    const leftLeg = new THREE.Mesh(legGeo, legMat);
    leftLeg.position.set(-0.25 * scale, 0.1 * scale, 0);
    addOutline(leftLeg, 0.02);
    characterGroup.add(leftLeg);

    const rightLeg = new THREE.Mesh(legGeo, legMat);
    rightLeg.position.set(0.25 * scale, 0.1 * scale, 0);
    addOutline(rightLeg, 0.02);
    characterGroup.add(rightLeg);

    // Backpack (Yellow)
    const backpackGeo = new THREE.BoxGeometry(0.6 * scale, 0.7 * scale, 0.4 * scale);
    const backpackMat = createAnimeMaterial(0xfdcb6e);
    const backpack = new THREE.Mesh(backpackGeo, backpackMat);
    backpack.position.set(0, 1.2 * scale, -0.4 * scale);
    addOutline(backpack, 0.02);
    characterGroup.add(backpack);

    characterGroup.userData = {
        walkPhase: 0,
        leftArm: leftArm,
        rightArm: rightArm,
        leftLeg: leftLeg,
        rightLeg: rightLeg
    };

    return characterGroup;
}

function animateCharacter(character, delta) {
    const userData = character.userData;
    userData.walkPhase += delta * 5;

    const swing = Math.sin(userData.walkPhase) * 0.3;
    userData.leftArm.rotation.x = swing;
    userData.rightArm.rotation.x = -swing;
    userData.leftLeg.rotation.x = -swing;
    userData.rightLeg.rotation.x = swing;

    character.position.y = Math.abs(Math.sin(userData.walkPhase)) * 0.2;
}

// ========== ENVIRONMENT CREATION ==========
function createGround() {
    const groundGroup = new THREE.Group();
    const segments = 100;
    const width = 40;

    for (let i = 0; i < segments; i++) {
        const z = -i * (PATH_LENGTH / segments);
        const nextZ = -(i + 1) * (PATH_LENGTH / segments);
        
        const x = getPathX(z);
        const nextX = getPathX(nextZ);

        const planeGeo = new THREE.PlaneGeometry(width, PATH_LENGTH / segments);
        const planeMat = createAnimeMaterial(0x27ae60, { roughness: 0.8 });
        const plane = new THREE.Mesh(planeGeo, planeMat);
        
        plane.rotation.x = -Math.PI / 2;
        plane.position.set((x + nextX) / 2, 0, (z + nextZ) / 2);
        
        const angle = Math.atan2(nextX - x, nextZ - z);
        plane.rotation.z = angle;
        
        addOutline(plane, 0.03);
        groundGroup.add(plane);
    }

    return groundGroup;
}

        const trunkMat = createAnimeMaterial(0x8b4513);

        trunk.position.set(x, 1.5, z);

        group.add(trunk);

        const top = new THREE.Mesh(topGeo, topMat);
        top.position.set(x, 4, z);
        addOutline(top, 0.02);
        group.add(top);
    }

    const orbs = [];
    for (let i = 0; i < 25; i++) {
        const z = startZ + Math.random() * (endZ - startZ);
        const x = getPathX(z) + (Math.random() - 0.5) * 18;
        const y = 0.5 + Math.random() * 4;

        const orbGeo = new THREE.SphereGeometry(0.3, 16, 16);
        const orbMat = createAnimeMaterial(0x2ecc71, {
            emissive: 0x2ecc71,
            emissiveIntensity: 0.3
        });

            baseY: y, 
            phase: Math.random() * Math.PI * 2 
        };
        addOutline(orb, 0.02);
        orbs.push(orb);
        group.add(orb);
    }

    group.userData = { orbs: orbs };
    return group;
}

function animateAboutZone(zone, delta) {
    zone.userData.orbs.forEach(orb => {
        orb.userData.phase += delta * 2;
        orb.position.y = orb.userData.baseY + Math.sin(orb.userData.phase) * 0.3;
    });
}

function createProjectsZone() {
    const group = new THREE.Group();

    const endZ = ZONE_BOUNDARIES[4];
    const centerZ = (startZ + endZ) / 2;
    const x = getPathX(centerZ);

    const floorGeo = new THREE.PlaneGeometry(30, Math.abs(endZ - startZ));
    const floorMat = createAnimeMaterial(0x00cec9, {
        emissive: 0x00cec9,
        emissiveIntensity: 0.6,

        opacity: 0.3
    });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.position.set(x, 0.1, centerZ);
    group.add(floor);

    const pillars = [];
    for (let i = 0; i < 6; i++) {
        const z = startZ + (endZ - startZ) * ((i + 0.5) / 6);
        const pillarX = getPathX(z) + (i % 2 === 0 ? -6 : 6);

        const pillarGeo = new THREE.CylinderGeometry(0.5, 0.5, 8, 6);

        addOutline(pillar, 0.02);
        pillar.userData = { phase: i * Math.PI / 3 };
        pillars.push(pillar);
        group.add(pillar);
    }

    group.userData = { pillars: pillars, floor: floor };

function animateProjectsZone(zone, delta) {

// ========== PARTICLES SYSTEM ==========
function createParticles() {
    const particlesGroup = new THREE.Group();

    const dustGeo = new THREE.BufferGeometry();
    const dustPositions = new Float32Array(1000 * 3);
    for (let i = 0; i < 1000; i++) {
        dustPositions[i * 3] = (Math.random() - 0.5) * 100;
        dustPositions[i * 3 + 1] = Math.random() * 20;
        dustPositions[i * 3 + 2] = Math.random() * -PATH_LENGTH;
    }
    dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPositions, 3));
    const dustMat = new THREE.PointsMaterial({
        color: 0xffffff,
        size: 0.1,
        transparent: true,
        opacity: 0.6
    });
    const dust = new THREE.Points(dustGeo, dustMat);
    particlesGroup.add(dust);

    const streamerGeo = new THREE.BufferGeometry();
    const streamerPositions = new Float32Array(600 * 3);
    const streamerVelocities = [];
    for (let i = 0; i < 600; i++) {
        streamerPositions[i * 3] = (Math.random() - 0.5) * 80;
        streamerPositions[i * 3 + 1] = Math.random() * 30;
        streamerPositions[i * 3 + 2] = Math.random() * -PATH_LENGTH;
        streamerVelocities.push(0.5 + Math.random() * 1);
    }
    streamerGeo.setAttribute('position', new THREE.BufferAttribute(streamerPositions, 3));
    const streamerMat = new THREE.PointsMaterial({
        color: 0x00cec9,
        size: 0.3,
        transparent: true,
        opacity: 0.8
    });
    const streamers = new THREE.Points(streamerGeo, streamerMat);
    streamers.userData = { velocities: streamerVelocities };
    particlesGroup.add(streamers);

    const starsGeo = new THREE.BufferGeometry();
    const starsPositions = new Float32Array(2000 * 3);
    for (let i = 0; i < 2000; i++) {
        starsPositions[i * 3] = (Math.random() - 0.5) * 200;
        starsPositions[i * 3 + 1] = 20 + Math.random() * 80;
        starsPositions[i * 3 + 2] = Math.random() * -PATH_LENGTH;
    }
    starsGeo.setAttribute('position', new THREE.BufferAttribute(starsPositions, 3));
    const starsMat = new THREE.PointsMaterial({
        color: 0xffffff,
        size: 0.2,
        transparent: true,
        opacity: 0.9
    });
    const stars = new THREE.Points(starsGeo, starsMat);
    particlesGroup.add(stars);

    return particlesGroup;
}

function animateParticles(particlesGroup, delta) {
    const streamers = particlesGroup.children[1];
    const positions = streamers.geometry.attributes.position.array;
    const velocities = streamers.userData.velocities;

    for (let i = 0; i < positions.length / 3; i++) {
        positions[i * 3 + 1] -= velocities[i] * delta * 10;
        if (positions[i * 3 + 1] < 0) {
            positions[i * 3 + 1] = 30;
        }
    }
    streamers.geometry.attributes.position.needsUpdate = true;
}

// ========== SCENE SETUP ==========
function initScene() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0f0c29);
    scene.fog = new THREE.FogExp2(0x1a1a2e, 0.008);

    camera = new THREE.PerspectiveCamera(
        60,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
    );

    const canvas = document.getElementById('webgl-canvas');
    renderer = new THREE.WebGLRenderer({
        canvas: canvas,
        antialias: true
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
    directionalLight.position.set(10, 20, 10);
    scene.add(directionalLight);

    composer = new EffectComposer(renderer);
    const renderPass = new RenderPass(scene, camera);
    composer.addPass(renderPass);

    const bloomPass = new UnrealBloomPass(
        new THREE.Vector2(window.innerWidth, window.innerHeight),
        1.2,
        0.5,
        0.2
    );
    composer.addPass(bloomPass);

    ground = createGround();
    scene.add(ground);

    character = createCharacter();
    character.position.set(getPathX(50), 50, 50);
    character.userData.descending = true;
    character.userData.spinPhase = 0;
    scene.add(character);

    scene.add(createIntroZone());
    scene.add(createAboutZone());
    scene.add(createExperienceZone());
    scene.add(createProjectsZone());
    scene.add(createSkillsZone());
    scene.add(createEducationZone());
    scene.add(createContactZone());
    scene.add(createParticles());

    window.addEventListener('resize', onWindowResize);

    canvas.addEventListener('mousedown', onMouseDown);
    canvas.addEventListener('mousemove', onMouseMove);
    canvas.addEventListener('mouseup', onMouseUp);
    canvas.addEventListener('touchstart', onTouchStart);
    canvas.addEventListener('touchmove', onTouchMove);
    canvas.addEventListener('touchend', onTouchEnd);

    window.addEventListener('wheel', onScroll, { passive: false });
}

// ========== INPUT HANDLERS ==========
function onScroll(event) {
    if (!isIntroComplete) {
        event.preventDefault();
        return;
    }
    
    const scrollSpeed = 0.3;
    targetScrollPosition += event.deltaY * scrollSpeed;
    targetScrollPosition = Math.max(0, Math.min(PATH_LENGTH, targetScrollPosition));
}

function onMouseDown(event) {
    isDragging = true;
    previousMousePosition = { x: event.clientX, y: event.clientY };
}

function onMouseMove(event) {
    if (!isDragging) return;

    const deltaX = event.clientX - previousMousePosition.x;
    const deltaY = event.clientY - previousMousePosition.y;

    cameraRotation.y += deltaX * 0.005;
    cameraRotation.x += deltaY * 0.005;
    cameraRotation.x = Math.max(-Math.PI / 4, Math.min(Math.PI / 4, cameraRotation.x));

    previousMousePosition = { x: event.clientX, y: event.clientY };
}

function onMouseUp() {
    isDragging = false;
}

function onTouchStart(event) {
    if (event.touches.length === 1) {
        isDragging = true;
        previousMousePosition = { 
            x: event.touches[0].clientX, 
            y: event.touches[0].clientY 
        };
    }
}

function onTouchMove(event) {
    if (!isDragging || event.touches.length !== 1) return;

    const deltaX = event.touches[0].clientX - previousMousePosition.x;
    const deltaY = event.touches[0].clientY - previousMousePosition.y;

    cameraRotation.y += deltaX * 0.005;
    cameraRotation.x += deltaY * 0.005;
    cameraRotation.x = Math.max(-Math.PI / 4, Math.min(Math.PI / 4, cameraRotation.x));

    previousMousePosition = { 
        x: event.touches[0].clientX, 
        y: event.touches[0].clientY 
    };
}

function onTouchEnd() {
    isDragging = false;
}

function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    composer.setSize(window.innerWidth, window.innerHeight);
}

// ========== UPDATE FUNCTIONS ==========
function updateCharacter(delta) {
    if (character.userData.descending) {
        character.userData.spinPhase += delta * 3;
        character.position.y -= delta * 20;
        character.rotation.y += delta * 5;

        if (character.position.y <= 0) {
            character.position.y = 0;
            character.userData.descending = false;
            character.rotation.y = 0;
            completeIntro();
        }
        return;
    }

    const smoothing = 0.05;
    scrollPosition += (targetScrollPosition - scrollPosition) * smoothing;

    const charZ = -scrollPosition;
    const pathX = getPathX(charZ);
    
    character.position.x = pathX;
    character.position.z = charZ;

    const lookAhead = 2;
    const nextZ = charZ - lookAhead;
    const nextX = getPathX(nextZ);
    character.rotation.y = Math.PI + Math.atan2(nextX - pathX, -lookAhead);

    animateCharacter(character, delta);
}

function updateCamera() {
    const distance = 15;
    const height = 6;

    const charPos = character.position;
    const baseX = charPos.x - Math.sin(character.rotation.y) * distance;
    const baseZ = charPos.z - Math.cos(character.rotation.y) * distance;
    const baseY = charPos.y + height;

    const rotatedX = baseX + Math.sin(cameraRotation.y) * distance * 0.5;
    const rotatedZ = baseZ + Math.cos(cameraRotation.y) * distance * 0.5;
    const rotatedY = baseY + cameraRotation.x * 5;

    const smoothing = 0.05;
    camera.position.x += (rotatedX - camera.position.x) * smoothing;
    camera.position.y += (rotatedY - camera.position.y) * smoothing;
    camera.position.z += (rotatedZ - camera.position.z) * smoothing;

    camera.lookAt(charPos.x, charPos.y + 2, charPos.z);
}

function updateZone() {
    const charZ = character.position.z;
    let newZone = 0;

    for (let i = 0; i < ZONE_BOUNDARIES.length - 1; i++) {
        if (charZ <= ZONE_BOUNDARIES[i] && charZ > ZONE_BOUNDARIES[i + 1]) {
            newZone = i;
            break;
        }
    }

    if (newZone !== currentZone) {
        currentZone = newZone;
        updateUI();
    }

    const progress = (scrollPosition / PATH_LENGTH) * 100;
    document.getElementById('progress-fill').style.width = progress + '%';
}

function updateUI() {
    document.getElementById('zone-name').textContent = ZONE_NAMES[currentZone];

    document.querySelectorAll('.panel').forEach(panel => {
        panel.classList.remove('active');
    });
    const activePanel = document.querySelector(`.panel[data-zone="${currentZone}"]`);
    if (activePanel) {
        activePanel.classList.add('active');
    }

    document.querySelectorAll('.dot').forEach((dot, index) => {
        dot.classList.toggle('active', index === currentZone);
    });
}

// ========== ANIMATION LOOP ==========
const clock = new THREE.Clock();

function animate() {
    requestAnimationFrame(animate);

    const delta = clock.getDelta();

    updateCharacter(delta);
    updateCamera();
    
    // Only update zone if intro is complete
    if (isIntroComplete) {
        updateZone();
    }

    scene.children.forEach(child => {
        if (child.userData.ring) animateIntroZone(child, delta);
        if (child.userData.orbs && child.userData.orbs.length > 10) animateAboutZone(child, delta);
        if (child.userData.pillars) animateProjectsZone(child, delta);
        if (child.userData.core) animateSkillsZone(child, delta);
        if (child.userData.portal) animateContactZone(child, delta);
    });

    const particlesGroup = scene.children.find(child => child.children.length === 3 && child.children[0].type === 'Points');
    if (particlesGroup) {
        animateParticles(particlesGroup, delta);
    }

    composer.render();
}

// ========== UI POPULATION ==========
function populateUI() {
    document.getElementById('name-title').textContent = CONFIG.personal.name;
    document.getElementById('title-text').textContent = CONFIG.personal.title;

    const bioContent = document.getElementById('bio-content');
    CONFIG.personal.bio.forEach(text => {
        const p = document.createElement('p');
        p.textContent = text;
        bioContent.appendChild(p);
    });

    const statsGrid = document.getElementById('stats-grid');
    CONFIG.personal.stats.forEach(stat => {
        const card = document.createElement('div');
        card.className = 'stat-card';
        card.innerHTML = `
            <div class="stat-label">${stat.label}</div>
            <div class="stat-value">${stat.value}</div>
        `;
        statsGrid.appendChild(card);
    });

    const aboutContent = document.getElementById('about-content');
    CONFIG.personal.bio.forEach(text => {
        const p = document.createElement('p');
        p.textContent = text;
        p.style.marginBottom = '15px';
        p.style.lineHeight = '1.8';
        p.style.color = 'var(--text-dim)';
        aboutContent.appendChild(p);
    });

    const experienceContent = document.getElementById('experience-content');
    CONFIG.experience.forEach(exp => {
        const item = document.createElement('div');
        item.className = 'timeline-item';
        item.innerHTML = `
            <h3>${exp.title}</h3>
            <div class="timeline-company">${exp.company}</div>
            <div class="timeline-period">${exp.period}</div>
            <div class="timeline-description">${exp.description}</div>
        `;
        experienceContent.appendChild(item);
    });

    const projectsContent = document.getElementById('projects-content');
    CONFIG.projects.forEach(project => {
        const card = document.createElement('div');
        card.className = 'project-card';
        card.style.background = project.gradient || 'rgba(255, 255, 255, 0.05)';
        
        const tags = project.tags.map(tag => `<span class="tag">${tag}</span>`).join('');
        
        card.innerHTML = `
            <span class="project-emoji">${project.emoji}</span>
            <h3>${project.name}</h3>
            <p class="project-description">${project.description}</p>
            <div class="project-tags">${tags}</div>
        `;
        projectsContent.appendChild(card);
    });

    const skillsContent = document.getElementById('skills-content');
    CONFIG.skills.forEach(category => {
        const categoryDiv = document.createElement('div');
        categoryDiv.className = 'skill-category';

        let skillsHTML = `<h3>${category.category}</h3>`;
        category.items.forEach(skill => {
            skillsHTML += `
                <div class="skill-item">
                    <div class="skill-name">
                        <span>${skill.name}</span>
                        <span>${skill.level}%</span>
                    </div>
                    <div class="skill-bar">
                        <div class="skill-fill" style="width: ${skill.level}%"></div>
                    </div>
                </div>
            `;
        });

        categoryDiv.innerHTML = skillsHTML;
        skillsContent.appendChild(categoryDiv);
    });

    const educationContent = document.getElementById('education-content');
    CONFIG.education.forEach(edu => {
        const item = document.createElement('div');
        item.className = 'education-item';
        item.innerHTML = `
            <div class="education-icon">${edu.icon}</div>
            <div class="education-details">
                <h3>${edu.degree}</h3>
                <div class="education-institution">${edu.institution}</div>
                <div class="education-period">${edu.period}</div>
                <div class="education-description">${edu.description}</div>
            </div>
        `;
        educationContent.appendChild(item);
    });

    const certificationsContent = document.getElementById('certifications-content');
    CONFIG.certifications.forEach(cert => {
        const badge = document.createElement('div');
        badge.className = 'certification-badge';
        badge.textContent = cert;
        certificationsContent.appendChild(badge);
    });

    document.getElementById('contact-greeting').textContent = CONFIG.contact.greeting;
    document.getElementById('contact-message').textContent = CONFIG.contact.message;

    const contactLinks = document.getElementById('contact-links');
    CONFIG.contact.links.forEach(link => {
        const linkEl = document.createElement('a');
        linkEl.className = 'contact-link';
        linkEl.href = link.url;
        linkEl.target = '_blank';
        linkEl.innerHTML = `
            <span class="contact-icon">${link.icon}</span>
            <span class="contact-text">${link.text}</span>
        `;
        contactLinks.appendChild(linkEl);
    });
}

function completeIntro() {
    isIntroComplete = true;
    document.getElementById('scroll-hint').classList.remove('hidden');
}

function simulateLoading() {
    const loadingScreen = document.getElementById('loading-screen');
    const percentageEl = document.querySelector('.loading-percentage');
    let progress = 0;

    const interval = setInterval(() => {
        progress += Math.random() * 15;
        if (progress >= 100) {
            progress = 100;
            clearInterval(interval);
            
            setTimeout(() => {
                loadingScreen.classList.add('fade-out');
                setTimeout(() => {
                    loadingScreen.style.display = 'none';
                }, 1000);
            }, 500);
        }
        percentageEl.textContent = Math.floor(progress) + '%';
    }, 150);
}

// ========== INITIALIZATION ==========
function init() {
    populateUI();
    initScene();
    simulateLoading();
    animate();
}

init();
    </script>
